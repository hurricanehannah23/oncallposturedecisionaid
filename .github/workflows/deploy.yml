name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"   # every 30 min (GitHub may run scheduled jobs late)
  workflow_dispatch:          # lets cron-job.org (or the Actions tab) trigger a refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch NWS, SPC and NHC data
        run: python scripts/fetch_data.py _site/data

      - name: Add the page
        run: |
          cp index.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
